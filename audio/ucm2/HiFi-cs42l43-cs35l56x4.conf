#
# RTX Spark board with CS42L43 and 4x CS35L56, all on link 1.
#
# LOCAL CHANGES for the Lenovo Yoga 9 2-in-1 16N1X11 (83N7), verified by ear
# 2026-11-08, relative to alsa-ucm-conf#862:
#  * The 4 CS35L56 are WOOFERS (Windows: "left/right woofer", UID 0/4 L, 1/5 R).
#    The TWEETERS hang off the CS42L43's own speaker outputs, which upstream
#    never enables, so speakers sounded dull/flat.
#  * The codec is only reachable from DL0 via O150/O151 -> PDI2 -> host DP5
#    (PDI2->DP2 and codec DP6RX are dead ends here). So the jack moves off
#    DL1 onto DL0 too: Speaker and Headphones are conflicting ports of one sink.
#  * Tweeter crossover: Lenovo/Cirrus' 2nd-order high-pass at ~4.5 kHz, the
#    first EQ stage of the Windows CS42L43 tuning a1_dflt_3802_codec_cfg.bin
#    (Q2.30, order b0 b1 a1 a2 b2, + two unity stages), loaded into the codec
#    EQ (EQ1 = left, EQ2 = right). Never feed the tweeters unfiltered.

SectionVerb {
	EnableSequence [
		# woofers: DL0 -> O152/O153 -> PDI3 -> DP3 -> SDW1_Playback1 (CS35L56 x4)
		cset "name='O152 I032 Switch' 1"
		cset "name='O153 I033 Switch' 1"
		cset "name='PDI3 Demux' DP3"
		# codec (tweeters + jack): DL0 -> O150/O151 -> PDI2 -> host DP5 -> CS42L43 DP5
		cset "name='O150 I032 Switch' 1"
		cset "name='O151 I033 Switch' 1"
		cset "name='PDI5 Demux' None"
		cset "name='PDI2 Demux' DP5"
		cset "name='cs42l43 Headphone L Input 1' DP5RX1"
		cset "name='cs42l43 Headphone R Input 1' DP5RX2"
		# tweeter crossover in the codec EQ (coefficients load while EQ is off)
		cset "name='cs42l43 EQ Switch' off,off"
		cset "name='cs42l43 EQ Coefficients' 0xf1,0xbe,0x13,0x2a,0x1f,0x82,0xd8,0xab,0x9d,0x13,0x69,0x4c,0xdb,0x17,0x1a,0xe4,0xf1,0xbe,0x13,0x2a,0x00,0x00,0x00,0x40,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x40,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00"
		cset "name='cs42l43 EQ1 Input 1' DP5RX1"
		cset "name='cs42l43 EQ2 Input 1' DP5RX2"
		cset "name='cs42l43 EQ Switch' on,on"
		cset "name='cs42l43 Speaker Digital Switch' off,off"
		# capture: UL1 <- O020/O021 <- PDI13 <- host DP7
		cset "name='PDI13 Mux' DP7"
		cset "name='O020 I180 Switch' 1"
		cset "name='O021 I181 Switch' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='AMP1 Speaker Switch' 1"
		cset "name='AMP2 Speaker Switch' 1"
		cset "name='AMP3 Speaker Switch' 1"
		cset "name='AMP4 Speaker Switch' 1"
		# tweeters, through the high-pass EQ
		cset "name='cs42l43 Speaker L Input 1' EQ1"
		cset "name='cs42l43 Speaker R Input 1' EQ2"
		cset "name='cs42l43 Speaker Digital Switch' on,on"
	]
	DisableSequence [
		cset "name='cs42l43 Speaker Digital Switch' off,off"
		cset "name='cs42l43 Speaker L Input 1' None"
		cset "name='cs42l43 Speaker R Input 1' None"
		cset "name='AMP1 Speaker Switch' 0"
		cset "name='AMP2 Speaker Switch' 0"
		cset "name='AMP3 Speaker Switch' 0"
		cset "name='AMP4 Speaker Switch' 0"
		cset "name='Speaker Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Headphone Switch' 1"
		cset "name='cs42l43 Headphone Digital Volume' 229,229"
	]
	DisableSequence [
		cset "name='Headphone Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "cs42l43 Headphone Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone array"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
		cset "name='cs42l43 Decimator 3 Switch' 1"
		cset "name='cs42l43 Decimator 4 Switch' 1"
		cset "name='cs42l43 Decimator 3 Volume' 176"
		cset "name='cs42l43 Decimator 4 Volume' 176"
	]
	DisableSequence [
		cset "name='cs42l43 Decimator 3 Switch' 0"
		cset "name='cs42l43 Decimator 4 Switch' 0"
		# hand the shared DP1TX inputs to the Headset device: PipeWire
		# ACP probes/switches conflicting devices in an order that can
		# run this disable after the other device's enable
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (jack)"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='Headset Mic Switch' 1"
		cset "name='cs42l43 Decimator 1 Mode' ADC"
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
		cset "name='cs42l43 Decimator 1 Switch' 1"
	]
	DisableSequence [
		cset "name='cs42l43 Decimator 1 Switch' 0"
		cset "name='Headset Mic Switch' 0"
		# hand the shared DP1TX inputs to the Mic device (see above)
		cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
		cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		JackControl "Headset Mic Jack"
	}
}
