# Lenovo Yoga 9 16N1X11 camera: run libcamera's software ISP on the CPU. Its GPU
# path fails on the NVIDIA driver's EGL (surface-ultra-camera: glFramebufferTexture2D
# error 0x8CD6, no frames). 3840x2400 at 30 fps is heavy on the CPU; libcamera
# will offer smaller output sizes, which apps normally pick.
LIBCAMERA_SOFTISP_MODE=cpu
