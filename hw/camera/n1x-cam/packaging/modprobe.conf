# Lenovo Yoga 9 16N1X11 camera (hw/camera/n1x-cam)
# boot the CCU firmware (nvCCU.img from the Windows driver store) when the module loads
# ctrl=4: the value Windows writes to CCU+0x30000 on this laptop (\_SB.CCU0._DSM function 1);
# with it the CCU firmware drives the camera indicator light while a camera streams
options n1x_ccu_boot go=1 ctrl=4
# the sensor is driven by n1x_yoga_cam; the stock driver would only fight over its GPIOs
blacklist ov08x40
# libcamera's simple pipeline handler picks devices by media driver name and has no
# entry for this driver; it lists MediaTek's seninf, which this hardware is, so take that
# name (libcamera/configuration.yaml turns its software ISP on for it)
# ir=1: also register the infrared camera (VD55G0, 640x480 grey) as a second device
options n1x_yoga_cam mdev_name=mtk-seninf ir=1
