# SPDX-License-Identifier: CC0-1.0
# libcamera global configuration for the Lenovo Yoga 9 2-in-1 16N1X11 camera.
# n1x_yoga_cam registers its media graph as "mtk-seninf" (modprobe.conf), which
# libcamera's simple pipeline lists with the software ISP off (MediaTek boards with
# a hardware converter). This one has none: turn the software ISP on so that the
# camera's raw Bayer becomes an image. (From ikegam/surface-ultra-camera.)
version: 1
configuration:
  pipelines:
    simple:
      supported_devices:
        - driver: mtk-seninf
          software_isp: true
