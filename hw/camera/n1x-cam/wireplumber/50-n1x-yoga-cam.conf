# Lenovo Yoga 9 16N1X11: name the libcamera cameras in desktop pickers. libcamera reports
# both as front-facing, so WirePlumber would give them the same name.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*_ov08x40" } ]
    actions = { update-props = { node.description = "Lenovo Yoga Front Camera" } }
  }
  # the infrared camera (face recognition): its own name, and a lower priority so
  # that applications keep picking the colour camera by default
  {
    matches = [ { node.name = "~libcamera_input.*_vd55g0" } ]
    actions = { update-props = { node.description = "Lenovo Yoga IR Camera", priority.session = 300 } }
  }
]
# libcamera's camera manager takes a while to come up on a cold start (3840x2400
# media graph, tuning file, software ISP); at the first login after installing,
# WirePlumber listed only the raw V4L2 node until it was restarted. Give camera
# discovery more than the default 1 s.
wireplumber.settings = {
  monitor.camera-discovery-timeout = 5000
}
